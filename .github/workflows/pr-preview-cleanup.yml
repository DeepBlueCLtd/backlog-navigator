name: PR preview cleanup

on:
  pull_request:
    types: [closed]

concurrency:
  group: pr-preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          # If gh-pages doesn't exist yet (no deploy has happened), this
          # workflow simply exits — see the conditional below.
          fetch-depth: 1
        continue-on-error: true

      - name: Remove preview folder (idempotent)
        run: |
          set -e
          if [ ! -d "previews/pr-${PR_NUMBER}" ]; then
            echo "No preview folder found at previews/pr-${PR_NUMBER}; nothing to do."
            exit 0
          fi
          rm -rf "previews/pr-${PR_NUMBER}"
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing staged; folder was already absent in HEAD."
            exit 0
          fi
          git commit -m "chore(preview): remove preview for closed PR #${PR_NUMBER}"
          git push origin gh-pages
