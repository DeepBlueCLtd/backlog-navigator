name: Deploy to GitHub Pages

# DEPRECATED: deploys the legacy Backlog Navigator PWA. The bundled
# BACKLOG.md fixture has been archived, so deploying-as-is would push a
# broken default-view to the Pages site. Trigger reduced to
# workflow_dispatch only so it can be reactivated if the navigator is
# ever maintained again. See METHODOLOGY.md for what replaced it.
on:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_BASE_URL: /backlog-navigator/

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: .
          # Preserve in-flight PR preview folders during main redeploys
          # (FR-014 — without this, deploys to main wipe pr-preview content).
          clean-exclude: |
            previews
            previews/**
