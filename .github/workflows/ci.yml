name: CI

# DEPRECATED: this workflow tests the legacy Backlog Navigator PWA, which
# is no longer actively maintained. Trigger reduced to workflow_dispatch
# only — the navigator's bundled BACKLOG.md has moved to docs/history/ so
# automatic CI runs would fail. See METHODOLOGY.md for what replaced it.
on:
  workflow_dispatch:

# Minimum-scope GITHUB_TOKEN — CI is read-only; no writes needed.
# See SECURITY.md "Workflow security baseline".
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version is read from the packageManager field in package.json.
        # (FR-010 — must be present pre-extraction or this step fails with
        # "ambiguous pnpm version".)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright ffmpeg (chromium comes from @sparticuz/chromium)
        run: pnpm exec playwright install ffmpeg

      - name: Build (for preview server)
        run: pnpm build

      - name: Run Playwright (via bundled @sparticuz/chromium)
        # The in-process mock-github.ts route mock provides full offline
        # coverage — no credentials required (R-006 / FR-019).
        run: node run-playwright.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
