name: PR preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview
        run: pnpm build
        env:
          # Preview lives at /backlog-navigator/previews/pr-<n>/.
          VITE_BASE_URL: /backlog-navigator/previews/pr-${{ env.PR_NUMBER }}/
          # Preview renders the bundled dummy dataset (this repo itself,
          # not a debrief proxy). Adopters get a self-contained preview
          # at the default URL with no query params.
          VITE_DEFAULT_OWNER: 'DeepBlueCLtd'
          VITE_DEFAULT_REPO: 'backlog-navigator'
          # Push is a no-op on previews (FR-012).
          VITE_BACKLOG_NAV_DRY_RUN: 'true'

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: previews/pr-${{ env.PR_NUMBER }}
          # Only clean this PR's folder during the publish.
          clean-exclude: |
            !previews/pr-${{ env.PR_NUMBER }}/**

      - name: Upsert sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sentinel = '<!-- backlog-nav-preview -->';
            const previewUrl = `https://DeepBlueCLtd.github.io/backlog-navigator/previews/pr-${prNumber}/`;
            const body = `${sentinel}\n` +
              `🚀 **Backlog Navigator preview deployed**\n\n` +
              `- Default view: ${previewUrl}\n` +
              `- Same repo, branch: ${previewUrl}?repo=DeepBlueCLtd/backlog-navigator&branch=<branch>\n` +
              `- Legacy \`?pr=\` form (resolves against bundled default OWNER/REPO):\n` +
              `  ${previewUrl}?pr=42\n` +
              `- Third-party adopter form: ${previewUrl}?repo=acme/foo&branch=main\n\n` +
              `This preview runs in **dry-run mode** — "Push Changes" is a no-op.`;

            const { owner, repo } = context.repo;
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.startsWith(sentinel));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
            }
